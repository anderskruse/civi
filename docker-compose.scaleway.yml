version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: openwebui-postgres
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeMe123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openwebui-network

  openwebui:
    build:
      context: .
      dockerfile: Dockerfile.scaleway
    container_name: openwebui-app
    ports:
      - "3000:8080"
    environment:
      - DATABASE_URL=postgresql://openwebui:${DB_PASSWORD:-changeMe123}@postgres:5432/openwebui
      - VECTOR_DB=pgvector
      - SCALEWAY_API_KEY=${SCW_SECRET_KEY}
      - SCALEWAY_API_BASE=${SCALEWAY_API_BASE}
      - SCALEWAY_PROJECT_ID=${SCW_DEFAULT_PROJECT_ID}
      - SCALEWAY_DEFAULT_MODEL=gpt-oss-120b
      - OPENAI_API_BASE_URL=${SCALEWAY_API_BASE}
      - OPENAI_API_KEY=${SCW_SECRET_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_AUTH=True
      - ENABLE_SIGNUP=True
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openwebui-network
    restart: unless-stopped

volumes:
  postgres_data:
  openwebui_data:

networks:
  openwebui-network:
    driver: bridge
